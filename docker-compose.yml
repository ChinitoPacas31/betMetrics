services:
  # ============================================================================
  # 1. Servicio de Caché en Memoria: Redis 7 (Hardened con contraseña - OWASP A02:2025)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: betmetrics-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - betmetrics-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. Base de Datos Transaccional: PostgreSQL 16 (usuarios y paper bets)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: betmetrics-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-betmetrics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-betmetrics}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - betmetrics-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-betmetrics} -d ${POSTGRES_DB:-betmetrics}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 3. Microservicio Backend: FastAPI (+EV Engine & RapidAPI Resilient Client)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betmetrics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - path: ./.env
        required: false
    environment:
      - PORT=${PORT:-8000}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST:-odds.p.rapidapi.com}
      - THESPORTSDB_API_KEY=${THESPORTSDB_API_KEY:-}
      - TEAM_LOGO_CACHE_TTL_SECONDS=${TEAM_LOGO_CACHE_TTL_SECONDS:-2592000}
      - TEAM_LOGO_MISS_CACHE_TTL_SECONDS=${TEAM_LOGO_MISS_CACHE_TTL_SECONDS:-86400}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-betmetrics}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-betmetrics}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - betmetrics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  betmetrics-net:
    name: betmetrics-net
    driver: bridge

volumes:
  redis_data:
    name: betmetrics_redis_data
  postgres_data:
    name: betmetrics_postgres_data

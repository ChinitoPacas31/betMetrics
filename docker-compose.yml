services:
  # ============================================================================
  # 1. Servicio de Caché en Memoria: Redis 7 (Hardened con contraseña - OWASP A02:2025)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: betmetrics-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret_pass}
      --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - betmetrics-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # 2. Microservicio Backend: FastAPI (+EV Engine & RapidAPI Resilient Client)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: betmetrics-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:-betmetrics-super-secret-admin-token-2026}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-your-rapidapi-key-here}
      - RAPIDAPI_HOST=${RAPIDAPI_HOST:-odds.p.rapidapi.com}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret_pass}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - betmetrics-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # 3. (Opcional) Servicio Frontend: Next.js (App Router + Tailwind CSS)
  # Descomentar si se desea ejecutar también el cliente web en contenedor Docker
  # ============================================================================
  # frontend:
  #   image: node:20-alpine
  #   container_name: betmetrics-frontend
  #   working_dir: /app
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
  #   command: sh -c "npm install && npm run dev"
  #   depends_on:
  #     backend:
  #       condition: service_healthy
  #   networks:
  #     - betmetrics-net

networks:
  betmetrics-net:
    name: betmetrics-net
    driver: bridge

volumes:
  redis_data:
    name: betmetrics_redis_data

